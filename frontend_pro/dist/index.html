<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="posts">
    <div class="container posts__container">
        <div class="posts__list-wrapper">
            <ul class="posts__list" id="posts"></ul>
        </div>
        <div class="posts__form-wrapper">
            <form class="posts__form" id="posts__form">
                <input type="text" class="posts__title" id="posts__title" placeholder="Title" />
                <input type="text" class="posts__body" id="posts__body" placeholder="Body" />
                <input type="submit" class="posts__button" value="Add post" />
            </form>
        </div>
    </div>
</div>
<script src="./bundle.js"></script>
</body>
</html>
